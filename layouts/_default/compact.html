{{ define "main" }}
<div class="mx-auto flex max-w-screen-xl">
  <article class="flex min-h-[calc(100vh-var(--navbar-height))] w-full min-w-0 justify-center pb-8">
    <main class="w-full max-w-5xl px-6 pt-6 md:px-12">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl" data-pagefind-meta="title" data-pagefind-body>
        {{ .Title }}
      </h1>

      {{ with .Params.project_image }}
        {{- $image := resources.Get . -}}
        {{- with $image -}}
          {{- $hero := .Fill "1600x800 Center webp q84" -}}
          <figure class="mt-7">
            <img src="{{ $hero.RelPermalink }}" width="1600" height="800" alt="{{ $.Params.image_alt }}" class="w-full object-cover">
            {{ with $.Params.photo_credit }}
              <figcaption class="mt-2 text-right text-xs text-slate-500">
                {{ if $.Params.photo_credit_url }}<a href="{{ $.Params.photo_credit_url }}" target="_blank" rel="noopener" class="hover:underline">{{ . }}</a>{{ else }}{{ . }}{{ end }}
              </figcaption>
            {{ end }}
          </figure>
        {{- end -}}
      {{ end }}

      <div class="prose prose-slate mt-7 max-w-none lg:prose-lg dark:prose-invert [&_h2]:mb-3 [&_h2]:mt-10 [&_h2]:text-2xl [&_p]:leading-relaxed" data-pagefind-body>
        {{ with .Section }}
          <span data-pagefind-filter="type" style="display:none;">{{ . }}</span>
        {{ end }}
        {{ .Content }}
      </div>
    </main>
  </article>
</div>
{{ end }}
