name: Sync Publications from ORCID

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-orcid-publications
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Import the public ORCID record
        env:
          ORCID_ID: "0000-0003-2081-7061"
        run: |
          python -m pip install "hugobloxorcid==0.3.0" "pybtex==0.26.1" "PyYAML==6.0.3"
          hugoblox-orcid-import "$ORCID_ID" \
            --output "$RUNNER_TEMP/orcid-publications" \
            --no-download-pdf \
            --no-import-grants

      - name: Validate imported metadata and skip duplicates
        env:
          ORCID_ID: "0000-0003-2081-7061"
        run: |
          python scripts/normalize_orcid_publications.py "$RUNNER_TEMP/orcid-publications"
          python scripts/validate_orcid_publications.py \
            --imported "$RUNNER_TEMP/orcid-publications" \
            --existing content/publications \
            --output "$RUNNER_TEMP/validated-publications" \
            --orcid-id "$ORCID_ID"
          rsync -a --ignore-existing "$RUNNER_TEMP/validated-publications/" content/publications/

      - name: Open a reviewable update
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/orcid-publications
          delete-branch: true
          commit-message: "content: add publications discovered through ORCID"
          title: "Publications: review new ORCID records"
          body: |
            This automated update adds publications newly discovered in Regis Kopper's public ORCID record.

            Publication years and authors were resolved from ORCID, its BibTeX citation, and Crossref when a DOI is available. Records with missing or conflicting essentials and duplicate titles were skipped. BibTeX can itself omit contributors, so please verify every author list, title, publication status, and link before merging. Existing publication files are never overwritten.
          labels: automated-pr, content, publications
