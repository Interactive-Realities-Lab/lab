bio: Jessica Anioha is a master's student in Human–Computer Interaction at Iowa State University. Her research focuses
  on developing and evaluating crawling-based locomotion techniques in virtual reality. She investigates how different
  movement approaches influence navigation and user experience in immersive environments. Her interests include
  virtual reality, human–computer interaction, and spatial navigation.
