{{- $content := .wcBlock.content | default dict -}}
{{- $alt := $content.alt | default "SAGE Lab logo" -}}

<div class="mx-auto flex max-w-3xl flex-col items-center px-6 text-center">
  <img
    src="{{ "logo.svg" | relURL }}"
    alt="{{ $alt }}"
    width="802"
    height="792"
    class="h-auto w-44 sm:w-52"
    loading="eager"
  >
  <h1 class="mt-5 text-5xl font-bold tracking-tight text-gray-950 sm:text-7xl">
    {{ $content.title | default "SAGE Lab" }}
  </h1>
  {{ with $content.expansion }}
    <p class="mt-3 text-base tracking-wide text-gray-700 sm:text-lg">{{ . }}</p>
  {{ end }}
  {{ with $content.affiliation }}
    <p class="mt-2 text-sm text-gray-500">{{ . }}</p>
  {{ end }}
  {{ with $content.text }}
    <p class="mt-8 max-w-2xl text-lg leading-relaxed text-gray-700 sm:text-xl">{{ . }}</p>
  {{ end }}
</div>
