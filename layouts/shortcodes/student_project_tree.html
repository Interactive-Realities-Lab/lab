{{- $stem := printf "downloads/student-project-decision-tree-%s" .Page.Language.Lang -}}
{{- $svg := printf "%s.svg" $stem | relURL -}}
{{- $pdf := printf "%s.pdf" $stem | relURL -}}
<p><a href="{{ $svg }}">{{ .Get "open" }}</a><br><a href="{{ $pdf }}" target="_blank" rel="noopener">{{ .Get "pdf" }}</a></p>
<figure>
  <a href="{{ $svg }}" aria-label="{{ .Get "open" }}">
    <img src="{{ $svg }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async" style="display:block;width:100%;height:auto;max-width:1100px;margin:auto;">
  </a>
  <figcaption>{{ .Get "caption" }}</figcaption>
</figure>
