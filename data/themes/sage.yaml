# SAGE Lab theme: restrained black-and-white editorial palette.
hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "SAGE"
    vendor: "SAGE Lab"
    version: "1.0.0"
    license: "MIT"
    description: "A classic monochrome theme for the SAGE Lab."

  type: "dual"

  light:
    colors:
      primary: "#111111"
      secondary: "#525252"
      neutral: "#171717"
    surfaces:
      background: "#ffffff"
      foreground: "#171717"
      header:
        background: "#ffffff"
        foreground: "#111111"
      footer:
        background: "#fafafa"
        foreground: "#404040"

  dark:
    colors:
      primary: "#f5f5f5"
      secondary: "#a3a3a3"
      neutral: "#e5e5e5"
    surfaces:
      background: "#0a0a0a"
      foreground: "#f5f5f5"
      header:
        background: "#0a0a0a"
        foreground: "#f5f5f5"
      footer:
        background: "#111111"
        foreground: "#d4d4d4"
