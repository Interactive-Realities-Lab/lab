{{- $id := printf "reading-%s" (.Get "id") -}}
{{- $url := .Get "url" -}}
{{- with .Get "page" -}}{{- $url = relref $.Page . -}}{{- end -}}
<div style="display:flex;align-items:flex-start;gap:0.8rem;margin:1rem 0;">
  <input type="checkbox" id="{{ $id }}" aria-labelledby="{{ $id }}-label" style="width:1.15rem;height:1.15rem;flex:none;margin-top:0.25rem;accent-color:#276749;">
  <div>
    <label id="{{ $id }}-label" for="{{ $id }}" style="font-weight:600;cursor:pointer;">{{ .Get "label" }}</label><br>
    <a href="{{ $url }}">{{ .Get "title" }}</a>
    <p style="margin:0.25rem 0 0;">{{ .Inner | markdownify }}</p>
  </div>
</div>
