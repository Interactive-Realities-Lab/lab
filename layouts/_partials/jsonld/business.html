{{- $sharing_image := resources.GetMatch (path.Join "media" "sharing.*") -}}
{{- $logo_url := partial "functions/get_logo_url" . -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": {{ site.BaseURL }},
  "name": "Interactive Realities Laboratory",
  "alternateName": "IRLab",
  "description": {{ site.Params.hugoblox.identity.description }},
  "logo": {{ $logo_url }},
  {{ with $sharing_image }}"image": {{ .Permalink }},{{ end }}
  "parentOrganization": {
    "@type": "CollegeOrUniversity",
    "name": "Iowa State University",
    "url": "https://www.iastate.edu/"
  },
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Durham Center, Room 073",
    "addressLocality": "Ames",
    "addressRegion": "Iowa",
    "addressCountry": "US"
  },
  "sameAs": [
    "https://github.com/rempsyc/lab"
  ],
  "url": {{ site.BaseURL }}
}
</script>
